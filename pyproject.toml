[project]
name = "opencode-profiles"
version = "0.1.0"
description = "Manage multiple OpenCode configuration profiles via symlink switching, with backup and provider import"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
opencode-profiles = "opencode_profiles.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
